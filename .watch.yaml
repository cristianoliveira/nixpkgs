## Funzzy events file
# more details see: https://github.com/cristianoliveira/funzzy
#
# list here all the events and the commands that it should execute

# Conditional task
jobs:
  - name: stage files to git
    run_on_init: true
    run:
      - git add {{relative_filepath}}
      - git add -p
    change:
      - '*.nix'
      - '.watch.yaml'
      - 'Makefile'
      - 'README.md'

  - name: check flake
    run_on_init: true
    run: |
      set -euo pipefail
      nix flake check --show-trace
      make build-all
    change: '*.nix'

  - name: check default
    run: 'make check-default'
    change: '*.nix'

  # - name: All checks pass
  #   run: 'touch .fzz/on_success.evt'
  #   change:
  #     - '**/*'
  #   ignore:
  #     - '.fzz/**'
  #     - '.git/**'

  - name: rebase to git
    run_on_init: true
    run:
      - git fetch --all
      - git rebase origin/main
    change:
      - '.git/COMMIT_EDITMSG'

  # Finite remote observation. `scripts/watch-all.sh` runs this target
  # alongside the local file watcher and propagates its failure.
  - name: watch CI @ci
    trigger: manual
    timeout: 30m
    run: scripts/await-ci.sh
